version: "3.9"

# Local end-to-end stack: MinIO stands in for S3, a Postgres-backed Hive
# Metastore stands in for a managed metastore, and the runner does an
# in-process (local[*]) Spark run -- no cloud credentials required.

services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/raw-bucket/customer_orders &&
      echo 'order_id,customer_id,amount,updated_at' > /tmp/sample.csv &&
      echo '1,c1,10.5,2024-01-01T00:00:00Z' >> /tmp/sample.csv &&
      mc cp /tmp/sample.csv local/raw-bucket/customer_orders/sample.csv
      "

  metastore-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metastore
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 5s
      timeout: 5s
      retries: 10

  hive-metastore:
    image: apache/hive:3.1.3
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore-db:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=hive
    depends_on:
      metastore-db:
        condition: service_healthy
    ports:
      - "9083:9083"

  runner:
    build:
      context: .
      dockerfile: docker/dev/local-e2e/Dockerfile
      args:
        READER_IMAGE: ingestion-framework/reader-s3:latest
        WRITER_IMAGE: ingestion-framework/writer-hive:latest
    depends_on:
      minio-init:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      SPARK_MASTER: "local[*]"
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
    volumes:
      - ./config/datasets:/configs:ro
      - ./docker/dev/spark-defaults.conf:/opt/venv/lib/python3.11/site-packages/pyspark/conf/spark-defaults.conf:ro
      - ./docker/dev/hive-site.xml:/etc/hive/conf/hive-site.xml:ro
    command: ["--config-path", "/configs/customer_orders_local.yaml"]
