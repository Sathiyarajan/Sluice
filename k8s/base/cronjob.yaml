apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion-cronjob
  labels:
    app.kubernetes.io/part-of: ingestion-framework
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: ingestion-framework
        spec:
          restartPolicy: Never
          serviceAccountName: ingestion-runner
          containers:
            - name: ingestion
              image: REPLACE_ME_IMAGE
              args:
                - "--config-path"
                - "/configs/REPLACE_ME_CONFIG_FILE"
              envFrom:
                - secretRef:
                    name: REPLACE_ME_SECRET
              env:
                - name: SPARK_MASTER
                  value: "local[*]"
                - name: SPARK_DRIVER_MEMORY
                  value: "4g"
                - name: SPARK_EXECUTOR_MEMORY
                  value: "4g"
              resources:
                requests:
                  cpu: "2"
                  memory: 6Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
              volumeMounts:
                - name: dataset-config
                  mountPath: /configs
                  readOnly: true
          volumes:
            - name: dataset-config
              configMap:
                name: REPLACE_ME_CONFIGMAP
