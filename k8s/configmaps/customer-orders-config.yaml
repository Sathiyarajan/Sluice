apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-orders-config
data:
  customer_orders.yaml: |
    dataset_name: customer_orders
    description: Incremental ingestion of customer order events into the Delta lakehouse
    owner: data-eng
    schedule: "0 6 * * *"
    tags: ["sales", "orders", "incremental"]
    upstream_dependencies: ["raw_customer_orders_landed"]

    source:
      type: s3_parquet
      options:
        path: s3a://raw-bucket/customer_orders/
      watermark_column: updated_at
      schema:
        - name: order_id
          type: string
          nullable: false
        - name: customer_id
          type: string
          nullable: false
        - name: amount
          type: double
          nullable: false
        - name: updated_at
          type: string
          nullable: false

    targets:
      - type: databricks_delta
        write_mode: merge
        merge_keys: ["order_id"]
        partition_columns: []
        options:
          table: analytics.customer_orders
          schema_evolution: true

    retry:
      max_attempts: 3
      initial_delay_seconds: 5
      backoff_multiplier: 2
      max_delay_seconds: 120

    sla:
      max_runtime_minutes: 45
      alert_channels: ["slack:#data-eng-alerts", "email:oncall-data-eng@example.com"]

    data_quality:
      enabled: true
      min_row_count: 1
      max_null_fraction:
        order_id: 0.0
        customer_id: 0.01
      fail_pipeline_on_violation: true
