# Local-only stand-in for a real secret backend (Vault/AWS Secrets Manager/etc).
# Never used outside kind/dev — backs the ExternalSecret CRs with dummy,
# non-production values (MinIO/local Hive only, no real cloud credentials).
apiVersion: v1
kind: Secret
metadata:
  name: local-dummy-creds
type: Opaque
stringData:
  access_key_id: minioadmin
  secret_access_key: minioadmin
  jdbc_password: local-dev-password
  snowflake_password: local-dev-password
  databricks_host: http://localhost
  databricks_token: local-dev-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-dev-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-dev-secret-reader-binding
subjects:
  - kind: ServiceAccount
    name: ingestion-runner
    namespace: default
roleRef:
  kind: Role
  name: local-dev-secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: local-dev-store
spec:
  provider:
    kubernetes:
      remoteNamespace: default
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: ingestion-runner
