# Requires the External Secrets Operator (https://external-secrets.io) installed
# on the cluster. Never commit plaintext credentials -- this only references
# where the real secret lives in the external store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: REPLACE_ME_SECRET_STORE
    kind: SecretStore
  target:
    name: s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: REPLACE_ME/s3
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: REPLACE_ME/s3
        property: secret_access_key
