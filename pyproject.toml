[project]
name = "ingestion-framework"
version = "0.1.0"
description = "Production-grade config-driven PySpark data ingestion framework"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark==3.5.1",
    "delta-spark==3.2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "moto[s3]>=5.0",
    "boto3>=1.34",
]
airflow = [
    "apache-airflow>=2.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
